<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cfruit 水果營養成分計算機 & 法規標籤生成器 | 衛福部 TFDA 標準</title>
    <meta name="description" content="專業水果營養成分查詢、拼盤計算與商品法規營養標示生成工具，依台灣衛生福利部食藥署 (TFDA) 包裝食品法規標準產出合規黑框商品標籤貼紙。" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              fruit: {
                green: '#10B981',
                lime: '#84CC16',
                yellow: '#FBBF24',
                orange: '#F97316',
                red: '#EF4444',
                purple: '#8B5CF6',
                pink: '#EC4899',
              }
            },
            boxShadow: {
              'soft': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'card': '0 10px 25px -5px rgba(0, 0, 0, 0.06), 0 8px 10px -6px rgba(0, 0, 0, 0.04)',
            },
            fontSize: {
              '2xs': '0.6875rem',
              '3xs': '0.625rem',
            }
          }
        }
      }
    </script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f5f9;
      }
      ::-webkit-scrollbar-thumb {
        background: #cbd5e1;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #94a3b8;
      }

      /* 列印專用樣式：只列印商品營養標籤 */
      @media print {
        header, footer, nav, #label-config-panel, .no-print {
          display: none !important;
        }
        body {
          background: white !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        main {
          max-width: 100% !important;
          padding: 0 !important;
          margin: 0 !important;
        }
        #print-area {
          display: flex !important;
          justify-content: center !important;
          align-items: flex-start !important;
          padding: 20px !important;
        }
        #printable-label-card {
          box-shadow: none !important;
          border: 2px solid black !important;
          width: 320px !important;
          margin: 0 auto !important;
        }
      }

      /* 頂部導覽列：永遠單行、平滑橫向滾動、徹底防止字元直排 */
      header nav {
        display: flex !important;
        flex-wrap: nowrap !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch;
      }
      header nav button,
      header nav button * {
        white-space: nowrap !important;
        flex-shrink: 0 !important;
      }
    </style>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased selection:bg-emerald-500 selection:text-white min-h-screen flex flex-col">
    <!-- Sticky Navbar -->
    <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-slate-200/80 shadow-xs">
      <div class="max-w-7xl mx-auto px-3 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between h-16 min-w-0">
          <!-- Logo & Brand -->
          <div onclick="switchTab('plate')" class="flex items-center space-x-2 sm:space-x-3 cursor-pointer group select-none shrink-0">
            <img src="./assets/logo.png" alt="Cfruit Logo" class="w-9 h-9 sm:w-10 sm:h-10 object-contain rounded-2xl shadow-md border border-slate-100 group-hover:scale-105 transition-transform" />
            <div>
              <div class="flex items-center space-x-1.5 sm:space-x-2">
                <span class="font-extrabold text-base sm:text-xl text-slate-800 tracking-tight">
                  <span class="text-orange-500">C</span>fruit
                </span>
                <span class="text-3xs sm:text-xs px-1.5 sm:px-2 py-0.5 font-semibold bg-orange-100 text-orange-800 rounded-full hidden xl:inline-block whitespace-nowrap">
                  衛福部 TFDA 法規標準
                </span>
              </div>
              <p class="text-3xs sm:text-xs text-slate-500 hidden xl:block whitespace-nowrap">水果營養成分計算與商品法規標籤生成</p>
            </div>
          </div>

          <!-- Navigation Tabs -->
          <nav class="flex items-center space-x-1 sm:space-x-1.5 overflow-x-auto scrollbar-none py-1 ml-2 min-w-0">
            <button
              id="nav-btn-plate"
              onclick="switchTab('plate')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-semibold text-xs sm:text-sm transition-all flex items-center space-x-1.5 bg-emerald-600 text-white shadow-sm shadow-emerald-600/30 whitespace-nowrap shrink-0"
            >
              <span>🥗 水果搭配計算</span>
              <span id="navbar-plate-count" class="ml-0.5 px-1.5 py-0.2 rounded-full text-xs font-bold bg-white text-emerald-700">2</span>
            </button>

            <button
              id="nav-btn-cost"
              onclick="switchTab('cost')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-medium text-xs sm:text-sm transition-all flex items-center space-x-1 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0"
            >
              <span>💰 原料成本庫</span>
              <span class="text-3xs font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-md hidden lg:inline-block">取果率</span>
            </button>

            <button
              id="nav-btn-inventory"
              onclick="switchTab('inventory')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-medium text-xs sm:text-sm transition-all flex items-center space-x-1 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0"
            >
              <span>📈 價格波動庫</span>
              <span class="text-3xs font-bold bg-sky-100 text-sky-800 px-1.5 py-0.5 rounded-md hidden lg:inline-block">歷程</span>
            </button>

            <button
              id="nav-btn-season"
              onclick="switchTab('season')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-medium text-xs sm:text-sm transition-all flex items-center space-x-1 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0"
            >
              <span>🗓️ 產季指南</span>
              <span class="text-3xs font-bold bg-emerald-100 text-emerald-800 px-1.5 py-0.5 rounded-md hidden lg:inline-block">當令</span>
            </button>

            <button
              id="nav-btn-label"
              onclick="switchTab('label')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-medium text-xs sm:text-sm transition-all flex items-center space-x-1 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0"
            >
              <span>🏷️ 商品法規標籤</span>
              <span class="text-3xs font-bold bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded-md hidden lg:inline-block">合規</span>
            </button>

            <button
              id="nav-btn-catalog"
              onclick="switchTab('catalog')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-medium text-xs sm:text-sm transition-all flex items-center space-x-1 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0"
            >
              <span>📖 水果百科</span>
            </button>

            <button
              id="nav-btn-comparison"
              onclick="switchTab('comparison')"
              class="px-2.5 sm:px-3.5 py-1.5 sm:py-2 rounded-xl font-medium text-xs sm:text-sm transition-all flex items-center space-x-1 text-slate-600 hover:text-slate-900 hover:bg-slate-100 whitespace-nowrap shrink-0"
            >
              <span>⚖️ 雙果 PK</span>
            </button>

            <button
              id="backup-modal-btn"
              onclick="openBackupModal()"
              class="px-2 sm:px-2.5 py-1.5 sm:py-2 rounded-xl text-xs font-bold text-slate-700 hover:text-indigo-700 bg-slate-100 hover:bg-indigo-50 border border-slate-200 hover:border-indigo-200 transition flex items-center space-x-1 shrink-0 ml-1 whitespace-nowrap"
              title="全站資料打包備份與跨裝置匯入還原"
            >
              <span>💾</span>
              <span class="hidden xl:inline">資料備份</span>
            </button>
          </nav>
        </div>
      </div>
    </header>

    <!-- Main Container -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
      <div id="main-content"></div>
    </main>

    <!-- Modal Container -->
    <div id="modal-container"></div>
    <!-- Backup Modal Container -->
    <div id="backup-modal-container"></div>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200/80 py-6 text-center text-xs text-slate-500">
      <div class="max-w-7xl mx-auto px-4 space-y-2">
        <p class="flex items-center justify-center space-x-2">
          <img src="./assets/logo.png" alt="Cfruit" class="w-4 h-4 object-contain inline-block rounded-xs" />
          <span><strong>Cfruit 水果營養計算機 & 商品標籤生成器</strong> · 守護飲食健康與食品標示合規</span>
        </p>
        <p class="text-3xs sm:text-xs text-slate-400">
          法規依據標準：衛生福利部食品藥物管理署 (TFDA)《包裝食品營養標示應遵行事項》與台灣食品成分資料庫。<br/>
          商品標籤適用於生鮮切盤、水果沙拉盒、自製果乾與蔬果汁等包裝食品貼紙製作。
        </p>
      </div>
    </footer>

    <!-- Scripts -->
    <script src="./src/data/fruitsData.js"></script>
    <script src="./src/app.js"></script>
  </body>
</html>
